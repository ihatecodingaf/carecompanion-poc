<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PRECOVERY" />
    <meta name="theme-color" content="#0D1B2A" />
    <script>
      // GitHub Pages deep-link support: 404.html sends /app/some/route here as ?p=/some/route
      (function () {
        var p = new URLSearchParams(location.search).get('p');
        if (p) history.replaceState(null, '', location.pathname.replace(/\/$/, '') + p);
      })();
    </script>
    <title>PRECOVERY — Doctor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
